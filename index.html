  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ckground: var(--ink); overscroll-behavior-y: none; }\n\nbody {\n  margin: 0;\n  font-family: var(--font);\n  font-weight: 300;\n  color: var(--ink);\n  background: var(--white);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  overflow-x: hidden;\n}\n\nimg { display: block; max-width: 100%; }\n\na { color: inherit; text-decoration: none; }\n\n::selection { background: var(--lav-300); color: var(--ink); }\n\n/* ---------- layout helpers ---------- */\n.wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 clamp(20px, 5vw, 48px); }\n.section { padding-block: var(--section-pad); position: relative; }\n\n/* ---------- typography ---------- */\n.eyebrow {\n  font-weight: 500;\n  font-size: 13px;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  color: var(--accent);\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n}\n.eyebrow::before {\n  content: \"\";\n  width: 26px; height: 1.5px;\n  background: currentColor;\n  display: inline-block;\n}\n\nh1, h2, h3 { font-weight: 300; line-height: 1.02; letter-spacing: -.02em; margin: 0; text-wrap: balance; }\n\n.display {\n  font-size: clamp(44px, 7.4vw, 104px);\n  line-height: .96;\n  letter-spacing: -.035em;\n}\n.display em { font-style: normal; font-weight: 500; }\n.h2 { font-size: clamp(34px, 5vw, 68px); letter-spacing: -.03em; }\n.h3 { font-size: clamp(24px, 2.6vw, 34px); font-weight: 400; letter-spacing: -.02em; }\n\n.lead {\n  font-size: clamp(17px, 1.5vw, 21px);\n  line-height: 1.55;\n  font-weight: 300;\n  color: var(--ink-soft);\n  max-width: 46ch;\n  text-wrap: pretty;\n}\n.mono { font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace; }\n\n/* ---------- buttons ---------- */\n.btn {\n  --bg: var(--ink);\n  --fg: #fff;\n  font-family: var(--font);\n  font-weight: 500;\n  font-size: 16px;\n  letter-spacing: -.01em;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n  padding: 17px 28px;\n  border-radius: 100px;\n  border: none;\n  cursor: pointer;\n  background: var(--bg);\n  color: var(--fg);\n  transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s, background .25s;\n  will-change: transform;\n  position: relative;\n  white-space: nowrap;\n}\n.btn:hover { transform: translateY(-3px); box-shadow: 0 18px 34px -14px rgba(40,33,53,.5); }\n.btn:active { transform: translateY(-1px); }\n.btn--accent { --bg: var(--accent); --fg: #fff; }\n.btn--accent:hover { box-shadow: 0 18px 40px -12px color-mix(in oklab, var(--accent), transparent 35%); }\n.btn--ghost {\n  --bg: transparent; --fg: var(--ink);\n  border: 1.5px solid color-mix(in oklab, var(--ink), transparent 80%);\n}\n.btn--ghost:hover { background: rgba(0,0,0,.03); box-shadow: none; }\n.btn--lg { padding: 21px 38px; font-size: 18px; }\n.btn .arrow { transition: transform .35s cubic-bezier(.2,.8,.2,1); }\n.btn:hover .arrow { transform: translateX(4px); }\n\n/* ---------- logo lockup ---------- */\n.logo { display: inline-flex; align-items: center; gap: 11px; }\n.logo__mark {\n  width: 34px; height: 34px;\n  border-radius: 9px;\n  background: var(--accent);\n  display: grid; place-items: center;\n  box-shadow: 0 4px 12px -4px color-mix(in oklab, var(--accent), transparent 40%);\n  flex: none;\n}\n.logo__mark img { width: 64%; height: 64%; filter: brightness(0) invert(1); }\n.logo__word { font-weight: 600; font-size: 22px; letter-spacing: -.03em; }\n.logo__word b { font-weight: 600; }\n\n/* ---------- reveal animation ---------- */\n.reveal { opacity: 0; transform: translateY(34px); transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); }\n.reveal.in { opacity: 1; transform: none; }\n.reveal[data-d=\"1\"] { transition-delay: .08s; }\n.reveal[data-d=\"2\"] { transition-delay: .16s; }\n.reveal[data-d=\"3\"] { transition-delay: .24s; }\n.reveal[data-d=\"4\"] { transition-delay: .32s; }\n.reveal[data-d=\"5\"] { transition-delay: .40s; }\n@media (prefers-reduced-motion: reduce) {\n  .reveal { opacity: 1 !important; transform: none !important; }\n  html { scroll-behavior: auto; }\n}\n\n/* ---------- Tweaks panel ---------- */\n.tweaks {\n  position: fixed; top: 84px; right: 20px; z-index: 200;\n  width: 290px; background: #fff; color: var(--ink);\n  border: 1px solid rgba(40,33,53,.1); border-radius: 20px;\n  box-shadow: 0 30px 70px -24px rgba(40,33,53,.45);\n  padding: 18px; display: none; font-family: var(--font);\n}\n.tweaks.open { display: block; }\n.tweaks__top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }\n.tweaks__top h4 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }\n.tweaks__x { width: 28px; height: 28px; border: none; background: var(--lav-100); border-radius: 50%; cursor: pointer; color: var(--ink); font-size: 16px; line-height: 1; }\n.tw-group { margin-bottom: 16px; }\n.tw-group:last-child { margin-bottom: 0; }\n.tw-label { font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px; }\n.tw-swatches { display: flex; gap: 8px; }\n.tw-sw { width: 30px; height: 30px; border-radius: 9px; cursor: pointer; border: 2px solid transparent; transition: transform .15s; }\n.tw-sw:hover { transform: scale(1.08); }\n.tw-sw.sel { border-color: var(--ink); }\n.tw-seg { display: flex; flex-direction: column; gap: 6px; }\n.tw-opt { text-align: left; font-family: var(--font); font-size: 13px; padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(40,33,53,.12); background: #fff; cursor: pointer; color: var(--ink); transition: background .15s, border-color .15s; }\n.tw-opt:hover { background: var(--lav-50); }\n.tw-opt.sel { background: var(--accent); color: #fff; border-color: var(--accent); }\n.tw-range { width: 100%; accent-color: var(--accent); }\n\n/* pill chip */\n.chip {\n  display: inline-flex; align-items: center; gap: 8px;\n  padding: 8px 15px; border-radius: 100px;\n  background: var(--lav-100); color: var(--purple-700);\n  font-weight: 500; font-size: 14px; letter-spacing: -.01em;\n}\n.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: chip-dot-flash 1.4s ease-in-out infinite; }\n@keyframes chip-dot-flash {\n  0%, 100% { background: var(--accent); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }\n  50% { background: #B7B2C2; box-shadow: 0 0 0 4px rgba(183,178,194,0); }\n}\n@media (prefers-reduced-motion: reduce) { .chip .dot { animation: none; } }\n<\u002Fstyle>\n<style>/* ============================================================\n   WhoPaid — App UI replicas (phone screen, cards, rows)\n   Rebuilt from the product so numbers can animate.\n   ============================================================ */\n\n/* ---------- phone frame ---------- */\n.phone {\n  --w: 320px;\n  width: var(--w);\n  aspect-ratio: 320 / 660;\n  background: #ECEAF0;\n  border-radius: 52px;\n  padding: 11px;\n  box-shadow: var(--shadow-phone);\n  position: relative;\n  flex: none;\n}\n.phone::after { /* side buttons hint */\n  content: \"\"; position: absolute; right: -3px; top: 150px;\n  width: 3px; height: 64px; border-radius: 3px; background: #d9d6e0;\n}\n.phone__screen {\n  width: 100%; height: 100%;\n  background: linear-gradient(180deg, #F1EFF6 0%, #F6F5F9 38%);\n  border-radius: 42px;\n  overflow: hidden;\n  position: relative;\n  display: flex; flex-direction: column;\n}\n.phone__island {\n  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);\n  width: 96px; height: 27px; background: #15131a; border-radius: 20px; z-index: 6;\n}\n.statusbar {\n  display: flex; justify-content: space-between; align-items: center;\n  padding: 16px 26px 6px; font-size: 14px; font-weight: 500; color: var(--ink);\n}\n.statusbar .sb-r { display: flex; align-items: center; gap: 6px; }\n.statusbar .sb-r svg { display: block; }\n\n.appscroll { flex: 1; overflow: hidden; padding: 6px 16px 14px; display: flex; flex-direction: column; gap: 16px; }\n\n/* header */\n.app-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 0; }\n.app-head .who { display: flex; align-items: center; gap: 11px; }\n.app-head .who img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--lav-200); }\n.app-head .who span { font-weight: 500; font-size: 18px; }\n.app-head .bell { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: grid; place-items: center; position: relative; box-shadow: 0 4px 10px -6px rgba(40,33,53,.2); }\n.app-head .bell::after { content: \"\"; position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }\n\n/* balance cards */\n.bal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }\n.bal {\n  background: #fff; border-radius: 16px; padding: 14px 15px;\n  box-shadow: 0 6px 16px -12px rgba(40,33,53,.3);\n  display: flex; flex-direction: column; gap: 8px;\n}\n.bal .bal-top { display: flex; align-items: center; justify-content: space-between; }\n.bal .bal-label { font-size: 13px; color: var(--ink-soft); font-weight: 400; }\n.bal .bal-ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }\n.bal.owe .bal-ic { color: var(--red); border: 1.5px solid color-mix(in oklab, var(--red), transparent 70%); }\n.bal.owed .bal-ic { color: var(--green); border: 1.5px solid color-mix(in oklab, var(--green), transparent 70%); }\n.bal .bal-amt { font-size: 26px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }\n.bal.owe .bal-amt { color: var(--ink); }\n\n/* groups header */\n.grp-head { display: flex; align-items: center; justify-content: space-between; padding: 2px; }\n.grp-head h4 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -.02em; }\n.grp-head .acts { display: flex; gap: 8px; }\n.grp-head .acts .b { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }\n.grp-head .acts .b.plus { background: #fff; box-shadow: 0 4px 10px -6px rgba(40,33,53,.25); }\n.grp-head .acts .b.filt { background: #fff; box-shadow: 0 4px 10px -6px rgba(40,33,53,.25); }\n\n/* group rows */\n.glist { display: flex; flex-direction: column; gap: 10px; }\n.grow {\n  background: #fff; border-radius: 14px; padding: 13px 14px;\n  display: flex; align-items: center; gap: 12px;\n  box-shadow: 0 6px 16px -13px rgba(40,33,53,.35);\n}\n.grow .cat { margin: 0; }\n.cat { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }\n.cat svg { width: 52%; height: 52%; }\n.grow .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }\n.grow .mid .nm { font-weight: 500; font-size: 16px; letter-spacing: -.01em; }\n.grow .stack { display: flex; align-items: center; }\n.grow .stack img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; margin-left: -7px; border: 2px solid #fff; background: var(--lav-200); }\n.grow .stack img:first-child { margin-left: 0; }\n.grow .stack .more { font-size: 11px; color: var(--ink-faint); margin-left: 5px; font-weight: 500; }\n.grow .amt { font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }\n.grow .amt.neg { color: var(--red); }\n.grow .amt.pos { color: var(--green); }\n.grow .amt.set { color: var(--ink-faint); font-weight: 400; font-size: 13px; }\n\n/* category icon tints */\n.cat.train { background: #E2EEFB; color: #2F7CD6; }\n.cat.edu   { background: #E2EEFB; color: #2F7CD6; }\n.cat.mtn   { background: #DCF3E4; color: #069A4E; }\n.cat.food  { background: #FCEBD2; color: #E0972C; }\n\n/* add expense fab */\n.fab {\n  position: absolute; right: 16px; bottom: 84px;\n  background: var(--ink); color: #fff; border-radius: 100px;\n  padding: 13px 18px; font-size: 14px; font-weight: 500;\n  display: flex; align-items: center; gap: 9px;\n  box-shadow: 0 14px 28px -12px rgba(40,33,53,.6); z-index: 4;\n}\n\n/* bottom nav */\n.tabbar {\n  position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px;\n  background: #fff; border-radius: 100px; padding: 9px 14px;\n  display: flex; gap: 4px; box-shadow: 0 10px 26px -12px rgba(40,33,53,.35); z-index: 5;\n}\n.tabbar .tb { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 12px; border-radius: 100px; color: var(--ink-faint); font-size: 10px; }\n.tabbar .tb.on { color: var(--ink); background: var(--lav-100); }\n.tabbar .tb svg { width: 22px; height: 22px; }\n\n/* ---------- floating UI cards (hero/showcase) ---------- */\n.ucard {\n  background: #fff; border-radius: 20px;\n  box-shadow: var(--shadow-float);\n  padding: 16px 18px;\n}\n.contact .ct-head { display: flex; align-items: center; gap: 13px; padding-bottom: 13px; border-bottom: 1px solid #EFEFF2; }\n.contact .ct-head .avi { width: 50px; height: 50px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 600; font-size: 18px; letter-spacing: .01em; color: #fff; background: linear-gradient(140deg, var(--accent), color-mix(in srgb, var(--accent) 62%, #2A2335)); box-shadow: inset 0 1px 1px rgba(255,255,255,.35); }\n.contact .ct-head .nm { font-weight: 600; font-size: 17px; }\n.contact .ct-head .em { font-size: 13px; color: var(--ink-faint); font-weight: 300; }\n.contact .ct-lines { padding: 13px 0; display: flex; flex-direction: column; gap: 7px; font-size: 14.5px; font-weight: 300; }\n.contact .ct-lines u { text-decoration: none; border-bottom: 1.5px solid currentColor; }\n.contact .ct-lines .r { color: var(--red); font-weight: 500; }\n.contact .ct-lines .g { color: var(--green); font-weight: 500; }\n.contact .settle { width: 100%; background: var(--ink); color: #fff; border: none; border-radius: 100px; padding: 14px; font-family: var(--font); font-weight: 500; font-size: 15px; cursor: pointer; }\n\n.actitem { display: flex; align-items: center; gap: 12px; }\n.actitem .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }\n.actitem .tx { flex: 1; font-size: 14px; line-height: 1.35; font-weight: 300; }\n.actitem .tx b { font-weight: 600; }\n.actitem .tx .t { display: block; color: var(--ink-faint); font-size: 12px; margin-top: 3px; }\n.actitem .amt { font-weight: 500; font-size: 14px; font-variant-numeric: tabular-nums; }\n.actitem .amt.pos { color: var(--green); }\n.actitem .amt.neg { color: var(--red); }\n<\u002Fstyle>\n<style>/* ============================================================\n   WhoPaid — Section layouts\n   ============================================================ */\n\n/* ---------- NAV ---------- */\n.nav {\n  position: fixed; top: 0; left: 0; right: 0; z-index: 50;\n  padding-top: 14px;\n  transition: padding .35s ease, background .35s ease;\n}\n.nav__in {\n  display: flex; align-items: center; justify-content: space-between;\n  gap: 24px;\n  background:\n    linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.18)),\n    rgba(244,242,250,.55);\n  -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);\n  border: none;\n  border-radius: 100px;\n  padding: 11px 20px 11px 28px;\n  box-shadow:\n    0 8px 30px -16px rgba(40,33,53,.28),\n    inset 0 1px 0 rgba(255,255,255,.65),\n    inset 0 -1px 1px rgba(40,33,53,.04);\n  transition: box-shadow .35s ease, background .35s ease;\n}\n.nav.scrolled { padding-top: 8px; }\n.nav.scrolled .nav__in {\n  background:\n    linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.24)),\n    rgba(244,242,250,.68);\n  box-shadow:\n    0 16px 40px -18px rgba(40,33,53,.42),\n    inset 0 1px 0 rgba(255,255,255,.7),\n    inset 0 -1px 1px rgba(40,33,53,.05);\n}\n.nav__links { display: flex; gap: 30px; margin-left: auto; margin-right: 8px; }\n.nav__links a { font-size: 15px; font-weight: 400; color: var(--ink-soft); transition: color .2s; }\n.nav__links a:hover { color: var(--ink); }\n.nav__cta { padding: 12px 22px; font-size: 15px; }\n@media (max-width: 860px){ .nav__links { display: none; } }\n\n/* ---------- HERO ---------- */\n.hero { position: relative; min-height: 100svh; display: flex; align-items: center; padding-top: 120px; padding-bottom: 60px; overflow: hidden; background: linear-gradient(180deg, #FBFAFE 0%, #F4F0FC 55%, #EFE8FD 100%); }\n.hero__bg { position: absolute; inset: 0; pointer-events: none; }\n.blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; }\n.blob.b1 { width: 620px; height: 620px; background: radial-gradient(circle, #C9B2F5, transparent 70%); top: -180px; right: -120px; }\n.blob.b2 { width: 520px; height: 520px; background: radial-gradient(circle, #E7C9F0, transparent 70%); bottom: -200px; left: -160px; opacity: .5; }\n.watermark { position: absolute; top: 8%; left: 50%; width: min(54vw, 720px); transform: translateX(-30%); opacity: .05; }\n.watermark img { width: 100%; filter: brightness(0); }\n.grid-dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(120,62,190,.16) 1.1px, transparent 1.1px); background-size: 30px 30px; -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000, transparent 75%); mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000, transparent 75%); opacity: .5; }\n\n.hero__in { position: relative; z-index: 2; display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center; width: 100%; }\n.hero__copy { max-width: 600px; }\n.hero__copy .chip { margin-bottom: 24px; }\n.hero__copy .display { margin: 0 0 22px; }\n.hero__copy .lead { margin: 0 0 34px; }\n.hero__cta { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }\n.hero__meta { display: flex; align-items: center; gap: 14px; margin-top: 30px; font-size: 14px; color: var(--ink-soft); }\n.hero__meta b { font-weight: 600; color: var(--ink); }\n.stack-av { display: flex; }\n.stack-av img { width: 36px; height: 36px; border-radius: 50%; border: 2.5px so transform .6s cubic-bezier(.2,.85,.25,1), opacity .35s ease;\n}\n.push.show { opacity: 1; transform: translateY(0); }\n.push__ic { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; flex: none; }\n.push__ic img { width: 64%; height: 64%; filter: brightness(0) invert(1); }\n.push__body { flex: 1; min-width: 0; }\n.push__top { display: flex; justify-content: space-between; align-items: baseline; }\n.push__top b { font-size: 12px; font-weight: 600; letter-spacing: .01em; text-transform: uppercase; color: var(--ink-soft); }\n.push__time { font-size: 11px; color: var(--ink-faint); }\n.push__msg { font-size: 13.5px; font-weight: 400; color: var(--ink); line-height: 1.25; margin-top: 2px; text-wrap: pretty; }\n\n.grow .amt { transition: color .5s ease; }\n.grow.settled .amt { color: var(--ink-faint) !important; font-weight: 400; }\n.bal-amt { transition: color .5s ease; }\n\n@media (max-width: 960px){\n  .pin__in { grid-template-columns: 1fr; gap: 30px; justify-items: center; }\n  .pin__copy { max-width: 520px; }\n  .steps { display: none; }\n}\n\n/* ---------- FEATURES ---------- */\n.features { background: #fff; }\n.feat-head { margin-bottom: 50px; }\n.feat-head .eyebrow { margin-bottom: 18px; }\n.bento { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: minmax(220px, auto); gap: 20px; }\n.bcell { background: var(--lav-50); border: 1px solid var(--lav-100); border-radius: var(--radius-lg); padding: 30px; position: relative; overflow: hidden; transition: transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s; display: flex; flex-direction: column; }\n.bcell:hover { transform: translateY(-5px); box-shadow: var(--shadow-card); }\n.bcell.big { grid-row: span 2; grid-column: span 1; background: linear-gradient(160deg,#F3EEFC, #EBE0FB); }\n.bcell.wide { grid-column: span 2; flex-direction: row; gap: 28px; align-items: center; }\n.bcell__ic { width: 52px; height: 52px; border-radius: 15px; background ckground: #D7CFEA; }\n.rd-receipt .rl-tot { width: 64%; height: 9px; background: var(--ink); opacity: .82; margin-top: 3px; }\n.r { color: var(--red); } .g { color: var(--green); }\n\n.cur-row { display: flex; gap: 8px; margin-top: auto; }\n.cur-row span { width: 42px; height: 42px; border-radius: 12px; background: #fff; display: grid; place-items: center; font-size: 18px; font-weight: 500; color: var(--accent); box-shadow: 0 4px 12px -8px rgba(40,33,53,.3); }\n.feed-demo { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 14px; background: #fff; border-radius: 18px; padding: 18px; box-shadow: var(--shadow-card); }\n\n@media (max-width: 900px){\n  .how__grid { grid-template-columns: 1fr; }\n  .bento { grid-template-columns: 1fr 1fr; }\n  .bcell.big { grid-row: span 1; }\n  .bcell.wide { grid-column: span 2; flex-direction: column; align-items: stretch; }\n  .feed-demo { min-width: 0; }\n}\n@media (max-width: 600px){ .bento { grid-template-columns: 1fr; } .bcell.wide { grid-column: span 1; } }\n\n/* ---------- SCREENS SHOWCASE ---------- */\n.screens { background: var(--ink); overflow: hidden; padding-top: clamp(48px, 6vw, 84px); }\n.screens__bg { position: absolute; inset: 0; background: radial-gradient(ellipse 50% 45% at 50% 18%, rgba(120,62,190,.5), transparent 70%); }\n.screens__head { position: relative; text-align: center; max-width: 720px; margin: 0 auto 38px; }\n.screens__head .eyebrow { margin-bottom: 18px; justify-content: center; }\n.screens__head .eyebrow::before { background: var(--purple-300); }\n.screens__row { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; align-items: center; }\n.show-card { will-change: transform; animation: sc-float 6s ease-in-out infinite; }\n.show-card:nth-child(2) { animation-duration: 7.2s; animation-delay: -2.4s; }\n.show-card:nth-child(3) { animation-duration: 6.6s; animation-delay: -4.1s; }\n@keyframes sc-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }\n@media (prefers-reduced-motion: reduce) { .show-card { animation: none; } }\n.show-card > div { background: #F6F5F9; border-radius: 24px; padding: 20px; box-shadow: 0 40px 90px -40px rgba(0,0,0,.7); }\n.show-card.center { margin-top: -26px; }\n.show-card.center > div { background: #fff; }\n\n.sc-grp-head { display: flex; gap: 14px; align-items: center; }\n.sc-grp-head .nm { font-weight: 500; font-size: 18px; letter-spacing: -.01em; }\n.sc-grp-head .stack { display: flex; align-items: center; }\n.sc-grp-head .stack img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; margin-left: -7px; border: 2px solid #fff; background: var(--lav-200); }\n.sc-grp-head .stack img:first-child { margin-left: 0; }\n.sc-grp-head .stack .more { font-size: 12px; color: var(--ink-faint); margin-left: 7px; font-weight: 500; }\n.sc-grp-lines { display: flex; flex-direction: column; gap: 7px; font-size: 15px; font-weight: 300; margin: 16px 0; }\n.sc-grp-lines b { font-weight: 500; }\n.sc-grp .settle, .show-card .settle { width: 100%; background: var(--ink); color: #fff; border: none; border-radius: 100px; padding: 13px; font-family: var(--font); font-weight: 500; font-size: 14px; cursor: pointer; }\n\n.sc-act-title { font-size: 22px; font-weight: 500; letter-spacing: -.02em; margin-bottom: 14px; }\n.sc-act .actitem { padding: 10px 0; border-bottom: 1px solid #EFEFF2; }\n.sc-act .actitem:last-child { border-bottom: none; }\n\n.sc-list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }\n.sc-list-title { font-size: 22px; font-weight: 500; letter-spacing: -.02em; }\n.sc-list-add { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; transition: transform .2s; }\n.sc-list-add:hover { transform: rotate(90deg); }\n.sc-list .glist { gap: 9px; }\n.sc-list .grow { padding: 11px 12px; }\n.sc-list .grow
